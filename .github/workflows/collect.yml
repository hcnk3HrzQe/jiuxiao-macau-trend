name: collect

on:
  schedule:
    # 错开整点躲开 GitHub 调度高峰（文档：整点高负载，任务会被延迟甚至丢弃）
    # :23 主点位 + :53 备用；脚本内置「同小时去重」→ 每小时仍只留 1 条
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 防两次运行重叠打架
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取一期快照
        run: python3 collect.py

      - name: 提交回库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: $(TZ=Asia/Shanghai date +%F' '%H:%M) 快照"
            git push
          fi
