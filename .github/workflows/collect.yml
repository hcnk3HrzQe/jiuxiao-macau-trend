name: collect

on:
  schedule:
    # 常规：每小时 4 档冗余（15 分钟间隔，分钟错开 :00/:05/:10 大众刻度）
    # 背景：GitHub 免费调度会延迟数分钟，高负载时段整档丢弃（实测 8 小时只活 8 次 / 丢约一半）
    # 策略：多档同发打「霰弹」，单档丢了还有邻档顶上 —— 目标每 30 分钟至少落地一条
    - cron: "8 * * * *"
    - cron: "23 * * * *"
    - cron: "38 * * * *"
    - cron: "53 * * * *"
    # 开奖前密集抓：21:02~21:32 中国（= 13:02~13:32 UTC）每 5 分钟一条
    # 分钟 ≡2 (mod 5)：错开 :00 整点 与 :05/:10… 的 */5 大众刻度，降延迟
    - cron: "2,7,12,17,22,27,32 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 防两次运行重叠打架
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取一期快照
        run: python3 collect.py

      - name: 提交回库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: $(TZ=Asia/Shanghai date +%F' '%H:%M) 快照"
            git push
          fi
